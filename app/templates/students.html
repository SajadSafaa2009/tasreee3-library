<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة تسريع</title>
    <link rel="icon" type="image/png" href="static/lib_logo4.png">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <main>
        <button  class="icon-button back-button" onclick="history.back()" >
            <img src="static/icons/arrow-left.svg" class="icon-img"  alt="">
        </button>
        
        <button  class="icon-button list-button" onclick="ShowSidePanel()" >
            <img src="static/icons/menu.svg" class="icon-img"  alt="">
        </button>

        <img src="static/abstract waves.png" class="background-image"  alt="">
        <!------------------------------------------------------------------------------------------------------------------->
            <div class="upper-div">
                <div class="subject-title-div  shorter-title" >
                    <h1>الطلبة المسرعين</h1>
                    
                </div>
            </div>
            <div class="students-encapsule-div">
                {% for student in students %}
                    <div class="student-div ">
                        <div class="right-div">
                            <div class="person-img {% if student.male%} male {% endif %}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user preview-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <h3>{{student.name}}</h3>
                        </div>
                        
                        <div class="buttons-div">
                            <button
                                {% if student.group_link == 0 or student.group_link == '0' or not student.group_link %}
                                    disabled
                                {% else %}
                                    onclick="window.open('{{ student.group_link }}', '_blank')"
                                {% endif %}
                            >
                                عرض القناة
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users preview-icon">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                                    <path d="M16 3.128a4 4 0 0 1 0 7.744"/>
                                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                                    <circle cx="9" cy="7" r="4"/>
                                </svg>
                            </button>

                            <button
                                {% if student.username == 0 or student.username == '0' or not student.username %}
                                    disabled
                                {% else %}
                                    onclick="window.open('https://t.me/{{ student.username }}', '_blank')"
                                {% endif %}
                            >
                                التواصل
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle-more preview-icon">
                                    <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>
                                    <path d="M8 12h.01"/>
                                    <path d="M12 12h.01"/>
                                    <path d="M16 12h.01"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                {% endfor %}   
            </div>
        

        

        <!------------------------------------------------------------------------------------------------------------------->

        <div class="student-page" id="student-page">

        </div>
        <div id="side-panel">
            <div style="height: 8%;width: 100%;">
                <button class="icon-button back-button" onclick="HideSidePanel()">
                    <img src="static/icons/x.svg" class="icon-img"  alt="">
                </button>
            </div>
            <div class="side-panel-buttons-div">
                <button class="side-panel-button" onclick="window.location.href='/home'">
                    <img src="static/icons/house.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">الصفحة الرئيسية</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/subjects'">
                    <img src="static/icons/book-text.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">{{ 'التحصيلي' if grade == '0' else 'التحصيلي' }}</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/iq'">
                    <img src="static/icons/brain.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">الذكاء</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/postsubjects'">
                    <img src="static/icons/book-text.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">{{ 'الثالث متوسط' if grade == '0' else 'السادس علمي' }}</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/news'">
                    <img src="static/icons/newspaper.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">الاخبار</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/students'">
                    <img src="static/icons/messages-circle.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">التواصل مع الطلبة المسرعين</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/'">
                    <img src="static/icons/user.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">تغيير نوع الدراسة</p>
                </button>
                <button class="side-panel-button" onclick="window.location.href='/about'">
                    <img src="static/icons/info.svg" class="side-panel-button-img"  alt="">
                    <p class="side-panel-button-p">عن مكتبة تسريع</p>
                </button>
            </div>
        </div>
        <div id="blur-screen" class="blur-screen">

        </div>
    </main>
</body>
<script>
    const side_panel = document.getElementById("side-panel");
    const blur_screen = document.getElementById("blur-screen");
    function ShowSidePanel(){
        side_panel.classList.add("side-panel-unveiled")
        blur_screen.classList.add("blur-active")
    }

</script>
</html>
